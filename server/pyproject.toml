[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sams"
version = "0.1.0"
description = "SuperAwesomeMagicalSecurity: security posture, attack paths, SIEM and remediation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "cryptography>=42",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
ai = ["anthropic>=0.70", "openai>=1.40", "mcp>=1.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sams = "sams.cli:main"

[tool.setuptools.packages.find]
include = ["sams*"]

[tool.setuptools.package-data]
sams = ["web/static/*", "siem/rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
