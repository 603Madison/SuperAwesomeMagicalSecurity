# SuperAwesomeMagicalSecurity server configuration.
# Secrets are NEVER written here: reference environment variables by name (*_env).
data_dir: /var/lib/sams
listen: 0.0.0.0
port: 8443
public_url: https://sams.dmz.example.com     # what agents/probes connect to
# admin_token: set SAMS_ADMIN_TOKEN instead, or let the server generate one on first start
trust_proxy: false                           # true only behind a reverse proxy you control
assume_flat_network: true                    # without firewall data, assume hosts can reach each other

agent_collect_interval: 3600
agent_log_sources: [/var/log/auth.log, /var/log/secure, journald]

vuln:
  mode: hybrid          # online | offline | hybrid. Offline uses only the local OSV mirror (`sams vulndb sync`)
  enrich: true          # CISA KEV + FIRST EPSS

siem:
  syslog_udp_port: 5514
  syslog_tcp_port: 5514
  retention_days: 90
  # extra_rules_dir: /etc/sams/rules

external:
  max_cidr_hosts: 256
  default_ports: top100
  rate_per_sec: 200

ai:
  enabled: true
  default_provider: claude
  allow_write_tools: false
  mcp_tokens: []
  providers:
    - name: claude
      type: anthropic
      model: claude-opus-5-5
      api_key_env: ANTHROPIC_API_KEY
    # - name: gpt
    #   type: openai
    #   model: gpt-5
    #   api_key_env: OPENAI_API_KEY
